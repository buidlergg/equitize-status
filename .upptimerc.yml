owner: buidlergg
repo: equitize-status
user-agent: buidlergg
secrets: []
skipDeleteIssues: true
skipDescriptionUpdate: true
skipHomepageUpdate: true

sites:
  - name: Website
    url: https://equitizepro.com
    expectedStatusCodes: [200]
  - name: API
    url: https://api.equitizepro.com/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Authentication service
    url: https://api.equitizepro.com/health/auth
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Database reads
    url: https://api.equitizepro.com/health/database
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'

status-website:
  cname: status.equitizepro.com
  name: Equitize Pro Status
  theme: light
  introTitle: "**Equitize Pro** service status"
  introMessage: "Availability checks for the website, API, authentication service and database. Checks are scheduled every five minutes and may be delayed. Authentication checks do not test email delivery. Background scan and alert completion are not yet monitored here."
  navbar:
    - title: Status
      href: /
    - title: Equitize Pro
      href: https://equitizepro.com
