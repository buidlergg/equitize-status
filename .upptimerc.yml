owner: buidlergg
repo: equitize-status
user-agent: buidlergg
secrets: []
skipDeleteIssues: true
skipDescriptionUpdate: true
skipHomepageUpdate: true

sites:
  - name: Website
    url: https://equitizepro.com
    expectedStatusCodes: [200]
  - name: API
    url: https://api.equitizepro.com/health
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Authentication service
    url: https://api.equitizepro.com/health/auth
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Database reads
    url: https://api.equitizepro.com/health/database
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"status":"ok"'

status-website:
  cname: status.equitizepro.com
  name: Equitize Pro Status
  theme: dark
  logoUrl: https://status.equitizepro.com/equitize-logo.png
  favicon: https://status.equitizepro.com/equitize-icon.png
  links:
    - rel: stylesheet
      href: https://status.equitizepro.com/equitize.css
  introTitle: "System status"
  introMessage: "Service availability and incident updates for Equitize Pro."
  customFootHtml: '<p class="monitoring-note">Monitoring since 4 October 2026. Checks are scheduled every five minutes and can be delayed. Email delivery, background scans and alert delivery are not covered.</p>'
  navbar:
    - title: Status
      href: /
    - title: Equitize Pro
      href: https://equitizepro.com
